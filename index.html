const hist=[];let hi=0;
const MX=document.createElement('canvas');
function matrix(){MX.style.cssText='position:fixed;inset:0;z-index:99;pointer-events:none';document.body.appendChild(MX);const c=MX.getContext('2d');MX.width=innerWidth;MX.height=innerHeight;const cols=Array(Math.ceil(MX.width/14)).fill(0);let n=0;(function f(){c.fillStyle='rgba(12,12,12,.1)';c.fillRect(0,0,MX.width,MX.height);c.fillStyle='#e0542f';c.font='14px monospace';cols.forEach((y,i)=>{c.fillText(String.fromCharCode(0x30A0+Math.random()*96|0),i*14,y);cols[i]=y>MX.height&&Math.random()>.97?0:y+14});if(++n<220)requestAnimationFrame(f);else MX.remove()})()}
// konami
const KON='ArrowUp ArrowUp ArrowDown ArrowDown ArrowLeft ArrowRight ArrowLeft ArrowRight b a'.split(' ');let kp=0;

const FALLBACK = ['command not found. i\'m just a pretty div.','that\'s not a thing here.','interesting. no.','i heard you. i\'m ignoring you.','error 418: i\'m a teapot.'];

const ROAST = {
  generic: [...FALLBACK,'bold of you to assume i\'d understand that.','typing random stuff won\'t get you hired.','your keyboard deserves better.','i\'ve seen smarter input from a cat walking on a laptop.','wow. a true hacker.','not even chatgpt knows what you meant.','that command was so bad my css broke a little.','try "help". it exists for people like you.','i\'m a static page and i still have more going on than that.','denied. vibe check failed.','are you okay? blink twice.','404: point of that command not found.'],
  repeat: ['you typed that already. it didn\'t work then either.','same thing, same result. einstein had a word for this.','persistence is cute. this isn\'t.','again? i\'m starting to worry about you.','you\'ve unlocked: nothing. congrats.'],
  short: ['one letter. impressive vocabulary.','"{x}"? that\'s the whole thought?','your cat typed that, right?','minimalism. i respect it. but no.','words can be longer than one letter, you know.'],

// ===== терминал =====

async function typeCmd(c){const d=add('<span class="ps">~$ </span><b></b>','line cmd');const b=d.querySelector('b');for(const ch of c){b.textContent+=ch;await wait(45+Math.random()*50)}await wait(250)}
async function boot(){
  for(const [c,lines] of SCRIPT){await typeCmd(c);for(const l of lines){add('<span class="ps">&gt; </span>'+l);await wait(60)}}

const pre=document.getElementById('ascii'),art=document.getElementById('art');

function frame(){

    const x=cx*(cB*cp+sA*sB*sp)-st*cA*sB,y=cx*(sB*cp-sA*cB*sp)+st*cA*cB,zz=5+cA*cx*sp+st*sA,oz=1/zz;

    const L=cp*ct*sB-cA*ct*sp-sA*st+cB*(cA*st-ct*sA*sp);
    const i=px+W*py;
    if(py>=0&&py<H&&px>=0&&px<W&&oz>z[i]){z[i]=oz;buf[i]=CH[Math.max(0,Math.min(CH.length-1,(L*8+3)|0))]}
  }
  let s='';for(let r=0;r<H;r++)s+=buf.slice(r*W,r*W+W).join('')+'\n';pre.textContent=s;
  A+=.012+my*.06;B+=.008+mx*.06;
  if(!reduce)requestAnimationFrame(frame);
}
frame();
